<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spirit — a single continuation point</title>
<style>
  :root { --navy: #1b4d6e; --ink: #1e293b; --line: #cbd5e1; --bg: #f2f7fa; --muted: #64748b; --green: #16a34a; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: -apple-system, system-ui, sans-serif; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { width: 100%; max-width: 460px; background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 28px; box-shadow: 0 12px 32px rgba(27,77,110,0.08); }
  h1 { font-size: 1.1rem; margin: 0 0 4px; }
  .sub { font-size: 0.82rem; color: var(--muted); margin: 0 0 20px; line-height: 1.5; }
  textarea { width: 100%; min-height: 80px; padding: 10px; border-radius: 10px; border: 1px solid var(--line); font-family: 'SF Mono', Consolas, monospace; font-size: 0.82rem; resize: vertical; }
  .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  button { font-size: 0.82rem; font-weight: 700; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line); background: #fff; color: var(--navy); cursor: pointer; }
  button.primary { background: var(--navy); color: #fff; border-color: var(--navy); }
  .status { margin-top: 14px; font-size: 0.78rem; color: var(--muted); min-height: 18px; }
  .status.ok { color: var(--green); }
</style>
</head>
<body>

<div class="card">
  <h1>Spirit — a single continuation point</h1>
  <p class="sub">Type something, snapshot it, reload the page, wake it back up. One key, one slot, no history — just the last thing you saved.</p>

  <textarea id="text" placeholder="Type anything...">half-written thought</textarea>
  <div class="row">
    <button class="primary" id="btnSnapshot">snapshot()</button>
    <button id="btnWake">wake()</button>
    <button id="btnPurge">purge()</button>
    <button id="btnWipe">wipe()</button>
  </div>
  <div class="status" id="status"></div>
</div>

<script src="gnoke-spirit.js"></script>
<script>
  const spirit = Spirit('demo-note');
  const text = document.getElementById('text');
  const status = document.getElementById('status');

  function say(msg, ok) {
    status.textContent = msg;
    status.className = 'status' + (ok ? ' ok' : '');
  }

  document.getElementById('btnSnapshot').addEventListener('click', async () => {
    await spirit.snapshot({ text: text.value });
    say('Saved. Reload this page and click wake() to prove it survived.', true);
  });

  document.getElementById('btnWake').addEventListener('click', async () => {
    const state = await spirit.wake();
    if (state) { text.value = state.text; say('Restored from IndexedDB.', true); }
    else say('Nothing saved yet.');
  });

  document.getElementById('btnPurge').addEventListener('click', async () => {
    await spirit.purge();
    say('This key purged.');
  });

  document.getElementById('btnWipe').addEventListener('click', async () => {
    await spirit.wipe();
    say('Entire store cleared.');
  });

  // On load, silently check if there's already something to wake — no click needed to see it exists.
  spirit.wake().then(state => {
    if (state) say('A saved snapshot exists — click wake() to load it.');
  });
</script>
</body>
</html>
